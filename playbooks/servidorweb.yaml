---
  - name: Instalacion y configuracion servidores web
    hosts: centos
    become: true

    vars_files:
      ../vars/database.yaml

    tasks:

    - name: Instalar httpd
      ansible.builtin.dnf:
        name: httpd
        state: present

    
    - name: Habilitar y arrancar httpd
      ansible.builtin.service:
        service: httpd
        state: started
        enabled: true

    - name: Permitir HTTP
      ansible.posix.firewalld:
        service: http
        state: enabled
        permanent: true
        immediate: true
        offline: true

    - name: Install php application
      ansible.builtin.template:
        src: ../templates/cumple.j2
        dest: /var/www/html/index.php
        mode: '0644'
        owner: apache
        group: apache

    - name: Set selinux booleans for database access from apache
      ansible.posix.seboolean:
        name: "{{ item }}"
        state: true
        persistent: true
      loop:
        - httpd_can_network_connect
        - httpd_can_network_connect_db


          # name: httpd
          # state: started
          #enabled: true

    - name: Instalar php
      ansible.builtin.dnf:
        name:
          - php
          - php-mysqlnd
          - php-fpm
        state: present

    - name: Habilitar php
      ansible.builtin.service:
        name: php-fpm
        state: started
        enabled: true

    - name: Instalar firewalld
      ansible.builtin.dnf:
        name: firewalld
        state: present

    - name: Habilitar firewalld
      ansible.posix.firewalld:
        name: firewalld
        state: started
        enabled: true

    - name: Permitir HTTPS
      ansible.posix.firewalld:
        service: https
        state: enabled
        permanent: true
        immediate: true
        offline: true

    - name: Permitir HTTP
      ansible.posix.firewalld:
        service: http
        state: enabled
        permanent: true
        immediate: true
        offline: true

    - name: Install php application
      ansible.builtin.template:
        src: ../templates/cumple.j2
        dest: /var/www/html/index.php
        mode: '0644'
        owner: apache
        group: apache

    - name: Set selinux booleans for database access from apache
      ansible.posix.seboolean:
        name: "{{ item }}"
        state: true
        persistent: true
      loop:
        - httpd_can_network_connect
        - httpd_can_network_connect_db

