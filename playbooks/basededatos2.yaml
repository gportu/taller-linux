---
- name: Instalacion y configuracion MariaDB Ubuntu
  hosts: database
  become: true

  vars_files:
    - ../vars/database.yaml

  tasks:

    - name: Instalar MariaDB y dependencias
      ansible.builtin.apt:
        name:
          - mariadb-server
          - python3-pymysql
          - ufw
        state: present
        update_cache: true

    - name: Iniciar MariaDB
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: Configurar MariaDB para conexiones remotas
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify: Reiniciar MariaDB

    - name: Permitir puerto MariaDB en UFW
      community.general.ufw:
        rule: allow
        port: "3306"
        proto: tcp

    - name: Copiar script SQL
      ansible.builtin.copy:
        src: ../files/cumples.sql
        dest: /tmp/cumples.sql
        mode: "0644"

    - name: Importar base de datos desde SQL
      community.mysql.mysql_db:
        name: "{{ DB_DBASE }}"
        state: import
        target: /tmp/cumples.sql
        login_user: root
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Crear usuario para la aplicacion web
      community.mysql.mysql_user:
        name: "{{ DB_USER }}"
        password: "{{ DB_PASS }}"
        host: "%"
        priv:
          "{{ DB_DBASE }}.*": "ALL"
        state: present
        login_user: root
        login_unix_socket: /var/run/mysqld/mysqld.sock

  handlers:

    - name: Reiniciar MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted
