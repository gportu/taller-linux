---
- name: Instalacion y configuracion MariaDB Ubuntu
  hosts: database
  become: true
  vars_files:
    - ../vars/database.yaml
  tasks:
    - name: Instalar MariaDB y dependencias
      ansible.builtin.apt:
        name:
          - mariadb-server
          - python3-pymysql
          - ufw
        state: present
        update_cache: true

    - name: Iniciar MariaDB
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: Configurar MariaDB para conexiones remotas
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify: Reiniciar MariaDB

    - name: Permitir puerto MariaDB en UFW solo desde el servidor web
      community.general.ufw:
        rule: allow
        port: "3306"
        proto: tcp
        src: "{{ hostvars[item].ansible_host }}"
      loop: "{{ groups['centos'] }}"

    - name: Verifica que la contrasenia de root exista
      community.mysql.mysql_user:
        login_user: root
        login_password: ""
        login_unix_socket: /var/run/mysqld/mysqld.sock
        check_implicit_admin: true
        name: root
        host: localhost
      register: mysql_root_check
      ignore_errors: true

    - name: Destranca el estado de la contrasenia
      ansible.builtin.debug:
        msg: "La password de root no esta inicializada"
      when: mysql_root_check.failed is false

    - name: Genera password de root si no existe
      include_tasks: ../tasks/initialize_root.yaml
      when: mysql_root_check.failed is false

    - name: Copiar script SQL
      ansible.builtin.copy:
        src: ../files/cumples.sql
        dest: /tmp/cumples.sql
        mode: "0644"

   - name: Obtener las bases de datos existentes en el servidor
      community.mysql.mysql_info:
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        filter: databases
      register: mariadb_info
 
    - name: Importar base de datos desde SQL (solo si la base aun no existe)
      community.mysql.mysql_db:
        name: "{{ DB_DBASE }}"
        state: import
        target: /tmp/cumples.sql
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
      when: DB_DBASE not in mariadb_info.databases
    - name: Crear usuario para la aplicacion web
      community.mysql.mysql_user:
        name: "{{ DB_USER }}"
        password: "{{ DB_PASS }}"
        host: "%"
        priv: "{{ DB_DBASE }}.*:ALL"
        state: present
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
  handlers:
    - name: Reiniciar MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted
